<svg xmlns="http://www.w3.org/2000/svg" width="960" height="306" viewBox="0 0 960 306">
<title>Code, circuits, and a camera</title>
<desc>Dark blue field with a teal circuit pattern and amber camera aperture.</desc>
<defs>
