  <text x="67" y="149" fill="#f1f8f7" font-size="53" font-weight="700" letter-spacing="-1.5">Code, circuits,</text>
  <text x="67" y="206" fill="#ffd38a" font-size="53" font-weight="700" letter-spacing="-1.5">and a camera.</text>
  <text x="70" y="247" fill="#bddbd9" font-size="16">SOFTWARE  /  EMBEDDED SYSTEMS  /  PHOTOGRAPHY</text>
