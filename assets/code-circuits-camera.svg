<g fill="#5fd3c4"><circle cx="555" cy="165" r="4"/><circle cx="543" cy="216" r="4"/><circle cx="892" cy="85" r="4"/><circle cx="897" cy="234" r="4"/></g>
<circle cx="770" cy="153" r="110" fill="#102331" stroke="#58bfb5" stroke-dasharray="4 7" stroke-width="2"/>
