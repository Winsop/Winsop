  <radialGradient id="lens"><stop stop-color="#0b1723"/><stop offset="1" stop-color="#194650"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#79bcb9" stroke-opacity=".12"/></pattern>
  <path id="blade" d="M770 60 A93 93 0 0 1 850.5 106.5 L796 119 L752 118Z"/>
</defs>
<rect width="960" height="306" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="958" height="304" rx="22" fill="none" stroke="#60b8b2" stroke-opacity=".5"/>
<rect x="570" y="23" width="363" height="260" rx="15" fill="url(#grid)"/>
