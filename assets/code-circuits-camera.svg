<g fill="#46887f" stroke="#9ae4cd" stroke-width="1.4">
  <use href="#blade"/><use href="#blade" transform="rotate(60 770 153)"/><use href="#blade" transform="rotate(120 770 153)"/>
  <use href="#blade" transform="rotate(180 770 153)"/><use href="#blade" transform="rotate(240 770 153)"/><use href="#blade" transform="rotate(300 770 153)"/>
